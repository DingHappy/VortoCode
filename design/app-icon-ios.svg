<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- iPhone 图标：由 desktop/app-icon.svg 改成满版方形（iOS 自己裁圆角），去掉内描边，内容放大 6%。导出 1024 无透明通道 PNG 到 mobile/ios/VortoCodeMobile/Assets.xcassets/AppIcon.appiconset/AppIcon.png（ADR-017 M4）。 -->
  <defs>
    <linearGradient id="surface" x1="80" y1="40" x2="920" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252B36"/>
      <stop offset="0.55" stop-color="#12161E"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="accent" x1="290" y1="250" x2="700" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9B68"/>
      <stop offset="0.48" stop-color="#FF7347"/>
      <stop offset="1" stop-color="#E84E36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 445) rotate(90) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7347" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7347" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#surface)"/>
  <g transform="translate(512 512) scale(1.06) translate(-512 -512)">
  <circle cx="512" cy="500" r="398" fill="url(#glow)"/>
  <ellipse cx="512" cy="500" rx="366" ry="183" fill="none" stroke="#FF7347" stroke-opacity="0.26" stroke-width="14" transform="rotate(-16 512 500)"/>
  <circle cx="847" cy="348" r="25" fill="#FF875B"/>
  <circle cx="847" cy="348" r="43" fill="none" stroke="#FF7347" stroke-opacity="0.22" stroke-width="9"/>
  <path d="M238 274H390L513 653L638 274H786L589 771C576 804 553 824 513 824C473 824 448 804 435 771L238 274Z" fill="url(#accent)" filter="url(#shadow)"/>
  <path d="M390 274L513 653L638 274" fill="none" stroke="#FFD0B6" stroke-opacity="0.24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
