name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# 取消同分支上仍在跑的旧 CI，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff
      - name: Ruff (real-error gate — 见 pyproject [tool.ruff.lint])
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10：测最低与较新两端
        python-version: ["3.10", "3.12"]
        suite: ["unit-core", "tui", "integration-live"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev,tui]"

      - name: Run tests (offline, deterministic)
        # 刻意不提供任何 API key / token：
        # 无 OPENAI_API_KEY → 角色 Agent 不会自动启用真实 LLM（保持离线）
        # 无 VORTOCODE_API_TOKEN / VORTOCODE_ENABLE_SHELL → 安全默认值生效
        env:
          OPENAI_API_KEY: ""
          VORTOCODE_API_TOKEN: ""
          VORTOCODE_ENABLE_SHELL: ""
          VORTOCODE_ENABLE_BROWSER: ""
          PYTHONUNBUFFERED: "1"
          SUITE: ${{ matrix.suite }}
        run: |
          set -euxo pipefail
          case "$SUITE" in
            unit-core)
              python -m pytest tests/unit tests/test_basic.py \
                --ignore=tests/unit/test_tui.py \
                --ignore=tests/unit/test_tui_attach.py \
                -vv --tb=short --durations=30
              ;;
            tui)
              python -m pytest tests/unit/test_tui.py tests/unit/test_tui_attach.py \
                -vv --tb=short --durations=30
              ;;
            integration-live)
              python -m pytest tests/integration tests/live \
                -vv --tb=short --durations=30
              ;;
            *)
              echo "unknown suite: $SUITE" >&2
              exit 2
              ;;
          esac
