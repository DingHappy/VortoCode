name: CI

on:
  push:
    branches: [main]
  pull_request:

# 取消同分支上仍在跑的旧 CI，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10：测最低与较新两端
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev,tui]"

      - name: Run tests (offline, deterministic)
        # 刻意不提供任何 API key / token：
        # 无 OPENAI_API_KEY → 角色 Agent 不会自动启用真实 LLM（保持离线）
        # 无 AUTODEV_API_TOKEN / AUTODEV_ENABLE_SHELL → 安全默认值生效
        env:
          OPENAI_API_KEY: ""
          AUTODEV_API_TOKEN: ""
        run: python -m pytest tests/ -q
