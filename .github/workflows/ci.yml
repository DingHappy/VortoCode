# runner 由仓库变量 CI_RUNNER 决定（Settings → Secrets and variables → Actions → Variables）：
#   未设置       → ubuntu-latest（GitHub 托管；**私有仓库每月仅 2000 分钟免费额度**）
#   self-hosted  → 自建 runner（**不计费**，私有仓库首选；装机见 docs/OPS.md）
# 换 runner 不用改这个文件——设个变量就行。
#
# 2026-07-12：免费额度耗尽（job 直接不启动、3 秒全红）→ 一度 `gh workflow disable CI`。
# 现已恢复：CI_RUNNER=self-hosted，跑在自建 runner 上（不计费）。**本地门禁照旧要跑**
# （`./scripts/ci-local.sh`——它清空 key 保证离线确定性，CI 绿不代替它）。
#
# ⚠ 全部 job 都挂在 "Set up job"（报下载 actions/checkout 时 SSL 失败）= runner 宿主机出不了海，
#   与改动无关。先查宿主机代理，别怀疑代码；排查步骤见 docs/OPS.md 第六节。
# **为什么每个 job 都建独占 venv 而不是直接 pip install**：自建 runner 上
# actions/setup-python 给的是 /opt/hostedtoolcache 里的解释器，**全机共享**。多个 job 并发
# `pip install -e .` 时，pip 会先卸载已装的 vortocode——卸到一半另一个 job 正要用 `vc`，
# 就报 `No such file or directory: .../bin/vc` 挂在安装步（2026-07-26 真机随机咬）。
# venv 建在各自 workspace 里，天然隔离；托管 runner 上多花几秒，代价可忽略。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:        # 手动触发：验证自建 runner 通没通，不用先造一个 push

permissions:
  contents: read

# ── 出海面收敛（2026-09-08）─────────────────────────────────────────────────
# 自建 runner 在国内，出海链路**每天抖 4–6 次**（实测：09-07 16/19 点，09-08 03/06/07/14 点，
# 四个 runner 每次同时中招 = 共因在宿主机那条通道）。抖动期间 runner 与 GitHub 失联，正在跑的
# job 被直接判 **Abandoned**——09-08 14:05 那次一口气带走 typecheck + 两个 3.12 suite。
# job 一旦开跑就全程依赖那条长连接，这点改不了；能改的是**缩短每个 job 的时间窗**，
# 降低与抖动窗口重叠的概率。实测各步耗时（run 34180541821）：
#   Install dependencies 56–64s ·  Set up Python(cache:pip) 25–27s ·  Post Set up Python 最高 46s
#   Run tests 33–188s（离线，不出海）
# 所以两件事：换国内 pip 源 + 用 runner 本地持久 pip 缓存，并**去掉 cache: pip**（见各 job 处注释）。
#
# 两个都是**变量驱动**，与 CI_RUNNER 同一套路数——将来换回 GitHub 托管 runner（转公开时必须换）
# 只要删掉仓库变量，本文件一个字不用动，默认值就是官方源。
env:
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
  PIP_CACHE_DIR: ${{ vars.PIP_CACHE_DIR || '/tmp/vortocode-pip-cache' }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"   # 每次 pip 调用少一次"查有没有新版"的出海请求
  PIP_RETRIES: "5"                     # 抖动是常态，别一次失败就判死
  PIP_TIMEOUT: "30"

# 取消同分支上仍在跑的旧 CI，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # 刻意**不开 cache: pip**：它把 pip 的 wheel 缓存存进 GitHub 的 Actions Cache 服务，
          # 在自建 runner 上那是一次纯粹的出海往返——实测 restore 最高 27s、save 最高 46s，
          # 比装包本身（56–64s）还占时间窗。改用 PIP_CACHE_DIR 指向 runner 本地持久目录：
          # 同样有缓存，但读写都在本机磁盘上，一个包都不用问 GitHub 要。
      - name: Install ruff（装进本 job 独占的 venv，见文件头「为什么用 venv」）
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install ruff
      - name: Ruff (real-error gate — 见 pyproject [tool.ruff.lint])
        run: .venv/bin/ruff check src tests

  typecheck:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # 刻意**不开 cache: pip**：它把 pip 的 wheel 缓存存进 GitHub 的 Actions Cache 服务，
          # 在自建 runner 上那是一次纯粹的出海往返——实测 restore 最高 27s、save 最高 46s，
          # 比装包本身（56–64s）还占时间窗。改用 PIP_CACHE_DIR 指向 runner 本地持久目录：
          # 同样有缓存，但读写都在本机磁盘上，一个包都不用问 GitHub 要。
      - name: Install mypy + 运行时依赖（要拿到真类型，不能只装 mypy）
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[llm,dev]"
      - name: Mypy (范围见 pyproject [tool.mypy] 的 files；圈外存量问题不阻塞)
        run: .venv/bin/python -m mypy

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10：测最低与较新两端
        python-version: ["3.10", "3.12"]
        suite: ["unit-core", "tui", "integration-live"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 同上：不开 cache: pip，改用 PIP_CACHE_DIR 的本地持久缓存（理由见文件头与 lint 处注释）。

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[llm,dev,tui]"

      - name: Run tests (offline, deterministic)
        # 刻意不提供任何 API key / token：
        # 无 OPENAI_API_KEY → 角色 Agent 不会自动启用真实 LLM（保持离线）
        # 无 VORTOCODE_API_TOKEN / VORTOCODE_ENABLE_SHELL → 安全默认值生效
        env:
          OPENAI_API_KEY: ""
          VORTOCODE_API_TOKEN: ""
          VORTOCODE_ENABLE_SHELL: ""
          VORTOCODE_ENABLE_BROWSER: ""
          PYTHONUNBUFFERED: "1"
          SUITE: ${{ matrix.suite }}
        run: |
          set -euxo pipefail
          case "$SUITE" in
            unit-core)
              # -n auto --dist loadfile：与本地门禁同款并行（ci-local.sh 实测 243s→82s）。
              # loadfile = 同一文件的用例锁在同一 worker，文件级 fixture/模块状态假设照旧成立。
              # 只并行这个最重的 suite；tui/integration-live 本来就小，串行少一个风险面。
              .venv/bin/python -m pytest tests/unit tests/test_basic.py \
                --ignore=tests/unit/test_tui.py \
                --ignore=tests/unit/test_tui_attach.py \
                -n auto --dist loadfile \
                -vv --tb=short --durations=30
              ;;
            tui)
              .venv/bin/python -m pytest tests/unit/test_tui.py tests/unit/test_tui_attach.py \
                -vv --tb=short --durations=30
              ;;
            integration-live)
              # tests/e2e = 交付链路 canary：单测证明每段对，它证明**接缝**没断
              # （2026-07-27 的五个真机 bug 全是"每段单测都绿、东西没送到人手机上"）。
              .venv/bin/python -m pytest tests/integration tests/live tests/e2e \
                -vv --tb=short --durations=30
              ;;
            *)
              echo "unknown suite: $SUITE" >&2
              exit 2
              ;;
          esac
