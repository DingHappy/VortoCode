# Optional cloud-side example. Check with `sshd -t` before reloading.
# The dedicated account must have only the host-generated public key.
# No shell, subsystem session, remote forwarding or additional destination.
Match User vortocode-cert-egress
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    GatewayPorts no
    MaxSessions 0
    PermitOpen acme-v02.api.letsencrypt.org:443 acme-staging-v02.api.letsencrypt.org:443 alidns.aliyuncs.com:443
Match all
