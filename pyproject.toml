[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vortocode"
version = "0.1.0"
description = "通用多 Agent 软件开发框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VortoCode Team"}
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=12",      # uvicorn 的 WS 升级库：缺了 /ws 无法握手、/agent 页连不上（裸 uvicorn 不含）
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "markdown>=3.4",
    "jedi>=0.19",          # 语义代码导航（find_definition/find_references，LSP 级、无需外部 server）
]

[project.optional-dependencies]
memory = [
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
mcp = [
    "mcp>=1.0.0",
]
tui = [
    "textual>=8.0",
    "rich>=13.0",
]
parsing = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
browser = [
    "playwright>=1.48.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # 门禁并行（ci-local.sh 用 -n auto --dist loadfile）。没装也能跑，脚本会自动退回串行。
    "pytest-xdist>=3.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0",   # yaml 是核心依赖且有官方 stub：装上而不是 ignore 掉
]
all = [
    "vortocode[memory,llm,mcp,parsing,tui,browser,dev]",
]

[project.scripts]
vortocode = "src.cli:main"
vc = "src.cli:main"

# 显式声明扁平布局：包名就是 src（代码用 from src.xxx 导入）。
# 否则 setuptools 见到 src/ 会误判为 src-layout，导致安装后 `import src` 不可用。
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# 类型检查**起步**（B5-5）：先圈住小而新、且最该被类型钉死的模块——LLM 客户端与三个安全边界
# （记忆写入策略 / 工具权限 / 会话能力）。全仓一次性开会淹在历史欠债里，故：
# - files 只列圈定范围；follow_imports=silent 让 mypy 仍跟着 import 拿类型，但**不报告**被引模块的错，
#   这样圈外的存量问题不阻塞 CI，圈内的却一个都跑不掉。
# - 范围随代码演进逐步扩，别回头把它改松。
python_version = "3.10"
files = [
    "src/llm",
    "src/memory/write_policy.py",
    "src/agents/permissions.py",
    "src/agents/capabilities.py",
    "src/agents/gate.py",          # 确认门内核：安全模型的心脏，必须被类型钉死
]
follow_imports = "silent"
ignore_missing_imports = true      # 可选依赖（openai/yaml/qdrant…）无 stub，不为此挂门禁
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI lint 门禁：拦"真错误"——语法错误(E9) + pyflakes 逻辑错误(F63/F7/F82)，
# 外加未用导入(F401)与 `import *`(F403)——A4（2026-07）已做一轮 `ruff --fix` 清理并收紧。
# 其余风格类(E/W/I 等)仍暂缓，逐步再收。
select = ["E9", "F63", "F7", "F82", "F401", "F403"]
