[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vortocode"
version = "0.1.0"
description = "通用多 Agent 软件开发框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VortoCode Team"}
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "markdown>=3.4",
    "jedi>=0.19",          # 语义代码导航（find_definition/find_references，LSP 级、无需外部 server）
]

[project.optional-dependencies]
memory = [
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
mcp = [
    "mcp>=1.0.0",
]
tui = [
    "textual>=8.0",
    "rich>=13.0",
]
parsing = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "vortocode[memory,llm,mcp,parsing,tui,dev]",
]

[project.scripts]
vortocode = "src.cli:main"
vc = "src.cli:main"

# 显式声明扁平布局：包名就是 src（代码用 from src.xxx 导入）。
# 否则 setuptools 见到 src/ 会误判为 src-layout，导致安装后 `import src` 不可用。
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
