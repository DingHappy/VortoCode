[package]
name = "vortocode-desktop"
version = "0.1.0"
description = "VortoCode local-first agent workbench"
authors = ["VortoCode Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vortocode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-websocket = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 远程 WS 桥接（R3a-2b）：必须由 Rust 侧发起握手并注入 token——tauri-plugin-websocket 的
# headers 来自 JS，token 会先进 webview，违背 spec「webview 拿不到 token 原文」。
# 版本/TLS 栈与 lock 中既有（经 tauri-plugin-websocket 传递）的一致，离线可复用缓存。
tokio = { version = "1", features = ["sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
