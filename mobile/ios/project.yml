name: VortoCodeMobile
options:
  bundleIdPrefix: com.vortocode
  deploymentTarget:
    iOS: "17.0"
packages:
  MobileCore:
    path: Packages/MobileCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.3.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  VortoCodeMobile:
    type: application
    platform: iOS
    sources:
      - path: VortoCodeMobile
        excludes: [Info.plist]
    info:
      path: VortoCodeMobile/Info.plist
      properties:
        CFBundleDisplayName: VortoCode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.vortocode.mobile.auth
            CFBundleURLSchemes: [vortocode-mobile-auth]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: 连接你配置的常驻助手，只访问你选择的助手地址。
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: 批准助理拟好的动作前，用 Face ID 确认是你本人。
        # 只用系统提供的标准加密（HTTPS、CryptoKit、钥匙串），属于出口管制豁免；TestFlight 每次上传不再问
        ITSAppUsesNonExemptEncryption: false
        # 与通知扩展共享的钥匙串分组；只有签名构建才会展开出团队前缀
        VCKeychainGroup: $(AppIdentifierPrefix)com.vortocode.mobile.shared
    entitlements:
      path: VortoCodeMobile/VortoCodeMobile.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)com.vortocode.mobile.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vortocode.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MobileCore
      - target: VortoCodeNotification
  # 推送正文解密（Notification Service Extension）：服务端只给 APNs 占位文字，真正内容加密在 enc 里
  VortoCodeNotification:
    type: app-extension
    platform: iOS
    sources:
      - path: VortoCodeNotification
        excludes: [Info.plist]
    info:
      path: VortoCodeNotification/Info.plist
      properties:
        CFBundleDisplayName: VortoCode 通知
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VCKeychainGroup: $(AppIdentifierPrefix)com.vortocode.mobile.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: VortoCodeNotification/VortoCodeNotification.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.vortocode.mobile.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vortocode.mobile.notification
        CODE_SIGN_STYLE: Automatic
  VortoCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VortoCodeMobileTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vortocode.mobile.tests
    dependencies:
      - target: VortoCodeMobile
  VortoCodeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VortoCodeMobileUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vortocode.mobile.uitests
    dependencies:
      - target: VortoCodeMobile
schemes:
  VortoCodeMobile:
    build:
      targets:
        VortoCodeMobile: all
    test:
      targets: [VortoCodeMobileTests, VortoCodeMobileUITests]
