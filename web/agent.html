<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VortoCode · 主 Agent</title>
<!-- PWA（P3）：加到主屏后全屏运行。访问路径见 docs/OPS.md「手机访问」——走 Tailscale，
     不暴露公网；鉴权仍是 VORTOCODE_API_TOKEN 那套，PWA 不引入新的信任面。 -->
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pwa-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VortoCode">
<!-- 样式与逻辑拆到 /agent.css + /agent.js（2026-08 重设计）；两条路由在 pages.py 显式注册，
     并在 auth 豁免清单里——页面本身免鉴权，它的静态件也必须免，否则登录门连样式都加载不出来。 -->
<link rel="stylesheet" href="/agent.css">
</head>
<body>
  <aside id="sidebar">
    <div class="sb-head">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="20" height="20" rx="6" fill="#5c8bee"/>
          <path d="M6 7l5 8 5-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>VortoCode</span>
      </div>
      <button id="newchat" title="新建对话">＋ 新对话</button>
    </div>
    <div id="sessions"></div>
    <div class="sb-foot"><a href="/artifacts" target="_blank" title="agent 产出的可分享网页">🖼 制品画廊</a></div>
  </aside>
  <div id="main">
  <header>
    <button id="sbtoggle" class="icon-btn" title="显示/隐藏会话列表">☰</button>
    <div class="title"><b>VortoCode</b><span class="sub">主 Agent 控制台</span></div>
    <span class="sp"></span>
    <span id="state">连接中…</span>
    <button id="mode" title="切换 plan(只读)/build(可写)">plan</button>
    <button class="hbtn" id="ctoggle" title="后台任务 / 流水线 / 通知控制台">控制台<span class="badge hide" id="hbadge"></span></button>
  </header>
  <div id="plan"></div>
  <div id="log"></div>
  <div id="hero">
    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="6" fill="#5c8bee"/>
        <path d="M6 7l5 8 5-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <h1>有什么要做的？</h1>
    <p class="sub">读代码、修 bug、答问题，或把整件活交给后台隔离流水线。</p>
    <div class="chips">
      <button class="chip" data-fill="看看当前分支和最近的改动，讲讲仓库现在的状态。"><b>看看仓库状态</b>当前分支、最近改动、待办</button>
      <button class="chip" data-fill="帮我修这个 bug：（把报错或现象贴在这里）"><b>修一个 bug</b>贴上报错，让它定位并修复</button>
      <button class="chip" data-fill="解释一下这段代码在做什么：（贴路径或代码）"><b>解释代码</b>读懂一段实现或一个模块</button>
      <button class="chip" data-fill="用 dev_auto 后台流水线做这件事并开 PR：（描述任务）"><b>后台跑一件活</b>拆解 → 隔离实现 → 自测 → PR</button>
    </div>
    <p class="foot">默认 <code>plan</code> 只读安全；右上角切到 <code>build</code> 才放开写入与重型工具。</p>
  </div>
  <div id="stream" class="msg"></div>
  <div class="hint">回车发送 · Shift+回车换行 · 运行中 Esc 中断 · 📎/拖拽/粘贴附图或音频 · 回复点🔊朗读</div>
  <div id="thumbs"></div>
  <footer>
    <button id="attach" title="附图/音频（也可拖拽或粘贴）">📎</button>
    <button id="rec" title="录音（再点停止；转 WAV 附到本轮）" hidden>🎙</button>
    <input id="file" type="file" accept="image/*,audio/*" multiple hidden>
    <textarea id="inp" placeholder="问点什么，或让它读代码 / 修 bug / 跑任务…"></textarea>
    <button id="send">发送</button>
  </footer>
  </div>
  <aside id="console" class="hidden">
    <div class="cs-tabs">
      <div class="cs-tab active" id="tab-tasks">任务</div>
      <div class="cs-tab" id="tab-pipes">流水线</div>
      <div class="cs-tab" id="tab-notices">通知<span class="badge hide" id="nbadge"></span></div>
      <div class="cs-tab" id="tab-cron">定时</div>
      <div class="cs-tab" id="tab-board">看板</div>
    </div>
    <div id="tasknew">
      <textarea id="taskinp" placeholder="描述一个开发任务，隔离流水线后台跑（worktree 实现 → 自测 → 落 vorto/* 分支，不碰 main）"></textarea>
      <button id="taskgo">后台跑</button>
    </div>
    <div class="cs-body" id="tasks"></div>
    <div class="cs-body" id="pipes" style="display:none"></div>
    <div class="cs-body" id="notices" style="display:none"></div>
    <div class="cs-body" id="cron" style="display:none"></div>
    <div class="cs-body" id="board" style="display:none"></div>
  </aside>
<script>
// PWA（P3）：注册 service worker——它只为"可安装"存在，不缓存任何东西（见 sw.js 的说明）。
// 留在页面内联（而不是 agent.js）：test_pwa_assets 钉住"页面自身声明了 PWA 三件套"。
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
<script src="/agent.js"></script>
</body>
</html>
