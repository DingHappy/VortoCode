<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VortoCode · 主 Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background: #14161b; color: #d7dae0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; border-bottom: 1px solid #2a2e37; display: flex; gap: 12px;
           align-items: center; font-size: 14px; }
  header b { color: #fff; }
  header .sp { flex: 1; }
  #mode { background: #222732; color: #d7dae0; border: 1px solid #3a4150; border-radius: 6px;
          padding: 4px 8px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; line-height: 1.5; }
  .msg { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
  .user { color: #8ab4f8; }
  .user::before { content: "› "; }
  .say  { color: #7f8896; font-size: 13px; }
  .tools { margin: 0 0 10px; border-left: 2px solid #2a2e37; padding-left: 10px; }
  .tools > summary { color: #7f8896; font-size: 13px; cursor: pointer; list-style: none; outline: none; }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::before { content: "▸ "; }
  .tools[open] > summary::before { content: "▾ "; }
  .tools .say { margin: 4px 0 0; }
  .emit { color: #d7dae0; white-space: normal; }
  .emit > :first-child { margin-top: 0; }
  .emit > :last-child  { margin-bottom: 0; }
  .emit p { margin: 0 0 8px; }
  .emit h1, .emit h2, .emit h3, .emit h4, .emit h5, .emit h6 { margin: 12px 0 6px; line-height: 1.3; color: #fff; }
  .emit h1 { font-size: 1.3em; } .emit h2 { font-size: 1.18em; } .emit h3 { font-size: 1.07em; }
  .emit h4, .emit h5, .emit h6 { font-size: 1em; }
  .emit ul, .emit ol { margin: 4px 0 8px; padding-left: 22px; }
  .emit li { margin: 2px 0; }
  .emit b { color: #f0f2f5; }
  .emit code { background: #232833; border: 1px solid #2f3645; border-radius: 4px; padding: 1px 5px; font-size: .92em; }
  .emit pre { background: #1b1f27; border: 1px solid #2a2e37; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0 10px; }
  .emit pre code { background: none; border: 0; padding: 0; font-size: .9em; display: block; white-space: pre; }
  .emit blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid #3a4150; color: #aab2c0; }
  .emit a { color: #8ab4f8; }
  .emit hr { border: 0; border-top: 1px solid #2a2e37; margin: 12px 0; }
  .err  { color: #f08a8a; }
  #stream { color: #9aa3b2; min-height: 0; white-space: pre-wrap; }
  footer { border-top: 1px solid #2a2e37; padding: 10px; display: flex; gap: 8px; }
  #inp { flex: 1; resize: none; height: 44px; background: #1b1f27; color: #e8eaed;
         border: 1px solid #3a4150; border-radius: 8px; padding: 10px; font: inherit; }
  #send { background: #2f6feb; color: #fff; border: 0; border-radius: 8px; padding: 0 18px;
          cursor: pointer; font: inherit; }
  #send:disabled { opacity: .5; cursor: default; }
  #send.stop { background: #b4433a; }       /* 忙时变「停止」红 */
  .hint { color: #6b7280; font-size: 12px; padding: 0 16px 8px; }
</style>
</head>
<body>
  <header>
    <b>VortoCode</b> · 主 Agent（Web）
    <span class="sp"></span>
    <span id="state" style="color:#7f8896">连接中…</span>
    <button id="mode" title="切换 plan(只读)/build(可写)">plan</button>
  </header>
  <div id="log"></div>
  <div id="stream" class="msg"></div>
  <div class="hint">回车发送 · Shift+回车换行 · 运行中 Esc 或点「停止」中断 · plan 只读、build 才放开写/重型工具 · 需配 OPENAI_API_KEY</div>
  <footer>
    <textarea id="inp" placeholder="问点什么，或让它读代码 / 扫描仓库…"></textarea>
    <button id="send">发送</button>
  </footer>
<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), streamEl = $("#stream"), stateEl = $("#state");
let mode = "plan", busy = false, ws = null, streamBuf = "";
let reconnectAttempts = 0, reconnectTimer = null;

// 断线自动重连：指数退避 0.8s→1.6→3.2→6.4→12.8→封顶15s（纯函数，便于测试）
function backoffDelay(n) { return Math.min(15000, 800 * Math.pow(2, n)); }
function scheduleReconnect() {
  if (reconnectTimer) return;                       // 已排队就不重复排
  const delay = backoffDelay(reconnectAttempts++);
  stateEl.textContent = "重连中…"; stateEl.style.color = "#f0b86e";
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay);
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function addHTML(cls, html) {     // 仅用于已渲染、已转义的安全 HTML（renderMarkdown 的输出）
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function setBusy(b) {                     // 忙时按钮变「停止」（仍可点，用于中断），闲时「发送」
  busy = b;
  const btn = $("#send");
  btn.textContent = b ? "停止" : "发送";
  btn.classList.toggle("stop", b);
}

// 工具活动折叠：一回合里的多次工具调用收进一个 <details>，运行时展开看实况、出结果后收起。
let toolGroup = null, toolCount = 0;
function toolLine(text) {
  if (!toolGroup) {
    toolGroup = document.createElement("details");
    toolGroup.className = "tools"; toolGroup.open = true;
    toolGroup.appendChild(document.createElement("summary"));
    log.appendChild(toolGroup); toolCount = 0;
  }
  const d = document.createElement("div");
  d.className = "say"; d.textContent = text;     // textContent：工具行始终纯文本
  toolGroup.appendChild(d); toolCount++;
  toolGroup.querySelector("summary").textContent = "🔧 工具活动 · " + toolCount;
  log.scrollTop = log.scrollHeight;
}
function endToolGroup() {     // 回合收尾：收起并定格计数
  if (!toolGroup) return;
  toolGroup.open = false;
  toolGroup.querySelector("summary").textContent = "🔧 " + toolCount + " 个工具调用";
  toolGroup = null;
}

// 轻量 Markdown 渲染：先转义全部 <>& 再只产出白名单标签 —— 模型文本里的任何原始 HTML
// 都被转义，绝不进 DOM，因此 innerHTML 安全（与 TUI 的 Rich Markdown 对齐）。
function renderMarkdown(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const safeUrl = (u) => {           // 仅放行 http/https/mailto，并编码引号尖括号防属性逃逸
    u = u.trim();
    if (!/^(https?:|mailto:)/i.test(u)) return "#";
    return u.replace(/"/g, "%22").replace(/'/g, "%27").replace(/</g, "%3C").replace(/>/g, "%3E");
  };
  const inline = (t) => {            // 先转义本段（XSS 在此消灭），再做行内：代码抽占位免被加粗/斜体污染
    t = esc(t);
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push("<code>" + c + "</code>"); return "\u0000C" + (codes.length - 1) + "\u0000"; });
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
         .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
                  (_, txt, url) => '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>");
    return t.replace(/\u0000C(\d+)\u0000/g, (_, n) => codes[Number(n)]);
  };

  src = String(src).replace(/\u0000/g, "");          // 去掉占位用的控制符，杜绝注入
  const blocks = [];                                 // 1) 抽出围栏代码块，内部不做任何变换
  src = src.replace(/```[ \t]*[\w+-]*[ \t]*\n([\s\S]*?)```/g, (_, code) => {
    blocks.push("<pre><code>" + esc(code.replace(/\n+$/, "")) + "</code></pre>");
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });

  const lines = src.split("\n"), out = [];           // 2) 块级解析在「原文」上判定结构（> # - 不被转义）；转义在 inline 内逐段做
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\u0000B\d+\u0000$/.test(line.trim())) { out.push(line.trim()); i++; continue; }
    if (!line.trim()) { i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push("<h" + n + ">" + inline(h[2].trim()) + "</h" + n + ">"); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(inline(lines[i].replace(/^\s*>\s?/, ""))); i++; }
      out.push("<blockquote>" + buf.join("<br>") + "</blockquote>"); continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++; }
      out.push("<ul>" + buf.join("") + "</ul>"); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push("<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"); i++; }
      out.push("<ol>" + buf.join("") + "</ol>"); continue;
    }
    const buf = [];                                  // 段落：聚合到空行或下一个块起始
    while (i < lines.length && lines[i].trim()
           && !/^\s*(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s?)/.test(lines[i])
           && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])
           && !/^\u0000B\d+\u0000$/.test(lines[i].trim())) { buf.push(inline(lines[i])); i++; }
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("\n").replace(/\u0000B(\d+)\u0000/g, (_, n) => blocks[Number(n)]);  // 还原代码块
}

function sessionId() {       // 每标签页一个稳定 sid（刷新仍在）→ 服务端据此让会话跨重连/刷新存活
  let sid = sessionStorage.getItem("vorto_sid");
  if (!sid) {
    sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "s" + Date.now().toString(36) + Math.random().toString(36).slice(2);
    sessionStorage.setItem("vorto_sid", sid);
  }
  return sid;
}

function connect() {
  const token = new URLSearchParams(location.search).get("token");
  const qs = new URLSearchParams();
  if (token) qs.set("token", token);
  qs.set("sid", sessionId());
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?" + qs.toString();
  ws = new WebSocket(url);
  ws.onopen = () => {
    reconnectAttempts = 0;                           // 连上即重置退避
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    stateEl.textContent = "已连接"; stateEl.style.color = "#7fce9a";
  };
  ws.onclose = () => {
    setBusy(false);
    endToolGroup(); streamBuf = ""; streamEl.textContent = "";   // 清掉半截回合（断线已中断在跑的回合）
    scheduleReconnect();
  };
  ws.onerror = () => { stateEl.textContent = "连接错误"; stateEl.style.color = "#f08a8a"; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    switch (m.type) {
      case "agent_history": if (log.children.length === 0) renderHistory(m.items); break;  // 刷新/重连回放（空 log 才放，避免重复）
      case "agent_say":    toolLine(m.text); break;
      case "agent_stream": streamBuf = m.text; streamEl.textContent = streamBuf; log.scrollTop = log.scrollHeight; break;
      case "agent_emit":   endToolGroup(); streamBuf = ""; streamEl.textContent = ""; addHTML("emit", renderMarkdown(m.text)); break;
      case "agent_error":  endToolGroup(); add("err", "出错: " + m.text); setBusy(false); break;
      case "agent_done":   endToolGroup(); streamBuf = ""; streamEl.textContent = ""; setBusy(false); break;
      case "agent_cancelled": endToolGroup(); streamBuf = ""; streamEl.textContent = ""; add("say", "⏹ 已中断"); setBusy(false); break;
    }
  };
}

function renderHistory(items) {          // 回放之前的对话：用户行 + 最终回复（markdown）
  (items || []).forEach((it) => {
    if (it.role === "user") add("user", it.text);
    else addHTML("emit", renderMarkdown(it.text));
  });
}

function cancelTurn() {                  // 「停止」：请求中断正在跑的回合
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "agent_cancel" }));
}
function sendMsg() {
  if (busy) { cancelTurn(); return; }    // 忙时点按钮 = 停止
  const inp = $("#inp"), text = inp.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  endToolGroup();                        // 新回合前先定格上一组工具活动
  add("user", text); inp.value = ""; setBusy(true);
  ws.send(JSON.stringify({ type: "agent", text, mode }));
}

$("#send").onclick = sendMsg;
$("#inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!busy) sendMsg(); }
  else if (e.key === "Escape" && busy) { e.preventDefault(); cancelTurn(); }   // Esc 停止
});
$("#mode").onclick = () => {
  mode = mode === "plan" ? "build" : "plan";
  $("#mode").textContent = mode;
  $("#mode").style.color = mode === "build" ? "#f0b86e" : "#d7dae0";
};
connect();
</script>
</body>
</html>
