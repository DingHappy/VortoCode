<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortoCode - AI 协作工位</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-tertiary: #1a1a3a;
            --bg-card: #1e1e3e;
            --text-primary: #e6e6ff;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #2a2a4a;
            --glow: rgba(99, 102, 241, 0.3);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 24px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: logo-glow 2s ease-in-out infinite;
        }
        
        @keyframes logo-glow {
            0%, 100% { box-shadow: 0 0 10px var(--glow); }
            50% { box-shadow: 0 0 20px var(--glow), 0 0 40px rgba(168, 85, 247, 0.2); }
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        
        .project-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
        }
        
        .project-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border-color: transparent;
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--glow);
        }
        
        /* 主体 */
        .main {
            display: flex;
            height: calc(100vh - 56px);
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 60px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 8px;
        }
        
        .sidebar-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .sidebar-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .sidebar-icon.active {
            background: var(--accent);
            color: #fff;
        }
        
        .sidebar-icon .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: var(--error);
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at center, var(--bg-secondary) 0%, var(--bg-primary) 70%);
        }
        
        /* 工位区域 */
        .workstation-area {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        /* 工位标题 */
        .area-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .area-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .area-title i {
            color: var(--accent);
        }
        
        .area-stats {
            display: flex;
            gap: 16px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .stat-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* 工位网格 */
        .workstation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }
        
        /* 工位卡片 */
        .workstation {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .workstation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .workstation:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .workstation:hover::before {
            opacity: 1;
        }
        
        .workstation.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }
        
        .workstation.active::before {
            opacity: 1;
        }
        
        .workstation.working {
            border-color: var(--success);
        }
        
        .workstation.working::before {
            background: linear-gradient(90deg, var(--success), #16a34a);
        }
        
        /* 工位头部 */
        .ws-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .ws-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }
        
        .ws-avatar.product { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .ws-avatar.architect { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .ws-avatar.developer { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .ws-avatar.tester { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .ws-avatar.reviewer { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .ws-status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--bg-card);
        }
        
        .ws-status-dot.idle { background: var(--text-muted); }
        .ws-status-dot.working { background: var(--success); animation: pulse 1.5s infinite; }
        .ws-status-dot.thinking { background: var(--warning); animation: pulse 1s infinite; }
        .ws-status-dot.error { background: var(--error); }
        
        .ws-info {
            flex: 1;
        }
        
        .ws-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }
        
        .ws-role {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .ws-status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .ws-status-badge.idle { background: var(--bg-tertiary); color: var(--text-muted); }
        .ws-status-badge.working { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .ws-status-badge.thinking { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .ws-status-badge.error { background: rgba(239, 68, 68, 0.2); color: var(--error); }
        
        /* 工位内容 */
        .ws-content {
            margin-bottom: 12px;
        }
        
        .ws-task {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .ws-task.empty {
            color: var(--text-muted);
            font-style: italic;
        }
        
        /* 工位进度 */
        .ws-progress {
            margin-top: 12px;
        }
        
        .progress-bar {
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.success { background: linear-gradient(90deg, var(--success), #16a34a); }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        /* 工位操作 */
        .ws-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .ws-action {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .ws-action:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        
        /* 动画效果 */
        @keyframes typing {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        /* 右侧面板 */
        .right-panel {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-header i {
            color: var(--accent);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        /* 活动日志 */
        .activity-item {
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .activity-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        
        .activity-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .activity-dot.info { background: var(--accent); }
        .activity-dot.success { background: var(--success); }
        .activity-dot.warning { background: var(--warning); }
        .activity-dot.error { background: var(--error); }
        
        .activity-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
        }
        
        .activity-text {
            color: var(--text-secondary);
        }
        
        /* 输入区 */
        .input-area {
            padding: 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-field {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 120px;
        }
        
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .input-field::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--glow);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <span class="logo-text">VortoCode</span>
        </div>
        
        <div class="header-center">
            <div class="project-badge">
                <span class="project-dot"></span>
                <span id="currentProject">vortocode</span>
                <i class="fas fa-chevron-down" style="font-size: 10px; color: var(--text-muted);"></i>
            </div>
        </div>
        
        <div class="header-actions">
            <button class="btn" onclick="resetAll()">
                <i class="fas fa-redo"></i> 重置
            </button>
            <button class="btn btn-primary" onclick="startTask()">
                <i class="fas fa-play"></i> 开始任务
            </button>
        </div>
    </header>
    
    <!-- 主体 -->
    <div class="main">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-icon active" title="工位" onclick="switchView('workstation')">
                <i class="fas fa-th-large"></i>
            </div>
            <div class="sidebar-icon" title="对话" onclick="switchView('chat')">
                <i class="fas fa-comments"></i>
            </div>
            <div class="sidebar-icon" title="项目" onclick="switchView('projects')">
                <i class="fas fa-folder"></i>
            </div>
            <div class="sidebar-icon" title="技能" onclick="switchView('skills')">
                <i class="fas fa-magic"></i>
                <span class="badge">3</span>
            </div>
            <div class="sidebar-icon" title="设置" onclick="switchView('settings')">
                <i class="fas fa-cog"></i>
            </div>
        </aside>
        
        <!-- 工作区 -->
        <div class="workspace">
            <!-- 工位区域 -->
            <div class="workstation-area">
                <div class="area-header">
                    <div class="area-title">
                        <i class="fas fa-th-large"></i>
                        <span>Agent 工位</span>
                    </div>
                    <div class="area-stats">
                        <div class="stat">
                            <span>活跃:</span>
                            <span class="stat-value" id="activeCount">0</span>
                        </div>
                        <div class="stat">
                            <span>任务:</span>
                            <span class="stat-value" id="taskCount">0</span>
                        </div>
                        <div class="stat">
                            <span>Tokens:</span>
                            <span class="stat-value" id="tokenCount">0</span>
                        </div>
                    </div>
                </div>
                
                <!-- 工位网格 -->
                <div class="workstation-grid" id="workstationGrid">
                    <!-- Product Agent -->
                    <div class="workstation" id="ws-product" onclick="selectAgent('product')">
                        <div class="ws-header">
                            <div class="ws-avatar product">
                                📋
                                <div class="ws-status-dot idle" id="status-product"></div>
                            </div>
                            <div class="ws-info">
                                <div class="ws-name">Product Agent</div>
                                <div class="ws-role">需求分析师</div>
                            </div>
                            <span class="ws-status-badge idle" id="badge-product">空闲</span>
                        </div>
                        <div class="ws-content">
                            <div class="ws-task empty" id="task-product">等待任务分配...</div>
                        </div>
                        <div class="ws-progress" id="progress-product" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill-product" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="progressText-product">进行中</span>
                                <span id="progressPercent-product">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Architect Agent -->
                    <div class="workstation" id="ws-architect" onclick="selectAgent('architect')">
                        <div class="ws-header">
                            <div class="ws-avatar architect">
                                🏗️
                                <div class="ws-status-dot idle" id="status-architect"></div>
                            </div>
                            <div class="ws-info">
                                <div class="ws-name">Architect Agent</div>
                                <div class="ws-role">架构师</div>
                            </div>
                            <span class="ws-status-badge idle" id="badge-architect">空闲</span>
                        </div>
                        <div class="ws-content">
                            <div class="ws-task empty" id="task-architect">等待任务分配...</div>
                        </div>
                        <div class="ws-progress" id="progress-architect" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill-architect" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="progressText-architect">进行中</span>
                                <span id="progressPercent-architect">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Developer Agent -->
                    <div class="workstation" id="ws-developer" onclick="selectAgent('developer')">
                        <div class="ws-header">
                            <div class="ws-avatar developer">
                                💻
                                <div class="ws-status-dot idle" id="status-developer"></div>
                            </div>
                            <div class="ws-info">
                                <div class="ws-name">Developer Agent</div>
                                <div class="ws-role">开发工程师</div>
                            </div>
                            <span class="ws-status-badge idle" id="badge-developer">空闲</span>
                        </div>
                        <div class="ws-content">
                            <div class="ws-task empty" id="task-developer">等待任务分配...</div>
                        </div>
                        <div class="ws-progress" id="progress-developer" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill-developer" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="progressText-developer">进行中</span>
                                <span id="progressPercent-developer">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Tester Agent -->
                    <div class="workstation" id="ws-tester" onclick="selectAgent('tester')">
                        <div class="ws-header">
                            <div class="ws-avatar tester">
                                🧪
                                <div class="ws-status-dot idle" id="status-tester"></div>
                            </div>
                            <div class="ws-info">
                                <div class="ws-name">Tester Agent</div>
                                <div class="ws-role">测试工程师</div>
                            </div>
                            <span class="ws-status-badge idle" id="badge-tester">空闲</span>
                        </div>
                        <div class="ws-content">
                            <div class="ws-task empty" id="task-tester">等待任务分配...</div>
                        </div>
                        <div class="ws-progress" id="progress-tester" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill-tester" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="progressText-tester">进行中</span>
                                <span id="progressPercent-tester">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Reviewer Agent -->
                    <div class="workstation" id="ws-reviewer" onclick="selectAgent('reviewer')">
                        <div class="ws-header">
                            <div class="ws-avatar reviewer">
                                🔍
                                <div class="ws-status-dot idle" id="status-reviewer"></div>
                            </div>
                            <div class="ws-info">
                                <div class="ws-name">Reviewer Agent</div>
                                <div class="ws-role">代码审查员</div>
                            </div>
                            <span class="ws-status-badge idle" id="badge-reviewer">空闲</span>
                        </div>
                        <div class="ws-content">
                            <div class="ws-task empty" id="task-reviewer">等待任务分配...</div>
                        </div>
                        <div class="ws-progress" id="progress-reviewer" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill-reviewer" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="progressText-reviewer">进行中</span>
                                <span id="progressPercent-reviewer">0%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea class="input-field" id="goalInput" 
                              placeholder="描述你想要开发的功能..."
                              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); startTask()}"></textarea>
                    <button class="send-btn" onclick="startTask()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 右侧面板 -->
        <div class="right-panel">
            <div class="panel-header">
                <i class="fas fa-stream"></i>
                <span>活动日志</span>
            </div>
            <div class="panel-content" id="activityLog">
                <div class="empty-state">
                    <i class="fas fa-stream"></i>
                    <p>暂无活动</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 状态管理
        const state = {
            running: false,
            currentAgent: null,
            agents: {
                product: { status: 'idle', task: null, progress: 0 },
                architect: { status: 'idle', task: null, progress: 0 },
                developer: { status: 'idle', task: null, progress: 0 },
                tester: { status: 'idle', task: null, progress: 0 },
                reviewer: { status: 'idle', task: null, progress: 0 }
            }
        };
        
        // WebSocket
        let ws = null;
        
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);
            
            ws.onopen = () => addLog('info', '系统已连接');
            ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }
        
        function handleMessage(msg) {
            switch (msg.type) {
                case 'task_started':
                    updateAgentStatus(msg.data.agent, 'working', msg.data.task.title);
                    addLog('info', `${msg.data.agent} 开始执行: ${msg.data.task.title}`);
                    break;
                case 'task_progress':
                    updateAgentProgress(msg.data.agent, msg.data.progress);
                    break;
                case 'task_completed':
                    updateAgentStatus(msg.data.agent, 'idle', null);
                    addLog('success', `${msg.data.agent} 完成任务`);
                    break;
                case 'task_failed':
                    updateAgentStatus(msg.data.agent, 'error', null);
                    addLog('error', `${msg.data.agent} 任务失败: ${msg.data.error}`);
                    break;
            }
        }
        
        // 更新 Agent 状态
        function updateAgentStatus(agentId, status, task) {
            state.agents[agentId].status = status;
            state.agents[agentId].task = task;
            
            // 更新状态点
            const statusDot = document.getElementById(`status-${agentId}`);
            statusDot.className = `ws-status-dot ${status}`;
            
            // 更新状态标签
            const badge = document.getElementById(`badge-${agentId}`);
            badge.className = `ws-status-badge ${status}`;
            badge.textContent = status === 'idle' ? '空闲' : status === 'working' ? '工作中' : status === 'thinking' ? '思考中' : '错误';
            
            // 更新任务显示
            const taskEl = document.getElementById(`task-${agentId}`);
            if (task) {
                taskEl.textContent = task;
                taskEl.classList.remove('empty');
            } else {
                taskEl.textContent = '等待任务分配...';
                taskEl.classList.add('empty');
            }
            
            // 更新工位样式
            const ws = document.getElementById(`ws-${agentId}`);
            ws.className = `workstation ${status === 'working' ? 'working active' : status === 'idle' ? '' : 'active'}`;
            
            // 显示/隐藏进度条
            const progress = document.getElementById(`progress-${agentId}`);
            progress.style.display = status === 'working' ? 'block' : 'none';
            
            // 更新活跃计数
            updateStats();
        }
        
        // 更新进度
        function updateAgentProgress(agentId, percent) {
            state.agents[agentId].progress = percent;
            
            const progressFill = document.getElementById(`progressFill-${agentId}`);
            progressFill.style.width = `${percent}%`;
            
            const progressPercent = document.getElementById(`progressPercent-${agentId}`);
            progressPercent.textContent = `${percent}%`;
            
            const progressText = document.getElementById(`progressText-${agentId}`);
            progressText.textContent = percent >= 100 ? '完成' : '进行中';
            
            if (percent >= 100) {
                progressFill.classList.add('success');
            }
        }
        
        // 更新统计
        function updateStats() {
            const activeCount = Object.values(state.agents).filter(a => a.status === 'working').length;
            document.getElementById('activeCount').textContent = activeCount;
        }
        
        // 选择 Agent
        function selectAgent(agentId) {
            state.currentAgent = agentId;
            document.querySelectorAll('.workstation').forEach(ws => ws.classList.remove('selected'));
            document.getElementById(`ws-${agentId}`).classList.add('selected');
        }
        
        // 添加日志
        function addLog(type, message) {
            const logContainer = document.getElementById('activityLog');
            
            // 移除空状态
            const emptyState = logContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'activity-item';
            item.innerHTML = `
                <div class="activity-header">
                    <span class="activity-dot ${type}"></span>
                    <span>${type === 'success' ? '✓' : type === 'error' ? '✗' : 'ℹ'}</span>
                    <span class="activity-time">${time}</span>
                </div>
                <div class="activity-text">${message}</div>
            `;
            
            logContainer.insertBefore(item, logContainer.firstChild);
            
            // 限制日志数量
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
        
        // 开始任务
        async function startTask() {
            const input = document.getElementById('goalInput');
            const goal = input.value.trim();
            if (!goal) return;
            
            input.value = '';
            
            // 模拟任务执行
            state.running = true;
            addLog('info', `开始任务: ${goal}`);
            
            // 更新所有 Agent 状态
            const agents = ['product', 'architect', 'developer', 'tester', 'reviewer'];
            const tasks = [
                '分析需求...',
                '设计架构...',
                '编写代码...',
                '运行测试...',
                '审查代码...'
            ];
            
            for (let i = 0; i < agents.length; i++) {
                if (!state.running) break;
                
                updateAgentStatus(agents[i], 'working', tasks[i]);
                addLog('info', `${agents[i]}: ${tasks[i]}`);
                
                // 模拟进度
                for (let p = 0; p <= 100; p += 20) {
                    await sleep(500);
                    updateAgentProgress(agents[i], p);
                }
                
                updateAgentStatus(agents[i], 'idle', null);
                addLog('success', `${agents[i]}: 完成`);
                
                await sleep(500);
            }
            
            state.running = false;
            addLog('success', '所有任务完成！');
        }
        
        // 重置
        function resetAll() {
            state.running = false;
            Object.keys(state.agents).forEach(agentId => {
                updateAgentStatus(agentId, 'idle', null);
            });
            addLog('info', '系统已重置');
        }
        
        // 工具函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 初始化
        connectWebSocket();
    </script>
</body>
</html>
