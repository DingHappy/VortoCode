<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VortoCode · 审批台</title>
<meta name="theme-color" content="#0e1013">
<link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
<!-- 单文件（样式/逻辑内联），与 /agent 的三件套拆分不同：那边是千行级的对话应用，
     这边是一个专注的审阅工具。多开两条路由换不来可维护性，反而多两处要维护的豁免清单。 -->
<style>
:root{--bg:#0e1013;--panel:#161a1f;--line:#242a31;--fg:#e6e9ee;--dim:#8b95a3;
      --blue:#5c8bee;--warn:#e0a33e;--bad:#e0625f;--ok:#5bbd7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:15px;margin:0;font-weight:600}
header .grow{flex:1}
a{color:var(--blue);text-decoration:none}
main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 53px)}
@media(max-width:860px){main{grid-template-columns:1fr}#list{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}
#list{border-right:1px solid var(--line);overflow:auto}
#detail{padding:20px;overflow:auto}
.run{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.run:hover{background:var(--panel)}
.run.sel{background:var(--panel);box-shadow:inset 3px 0 0 var(--blue)}
.run .top{display:flex;gap:8px;align-items:baseline}
.run .id{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.wait{color:var(--warn);border-color:var(--warn)}
.badge.fail{color:var(--bad);border-color:var(--bad)}
.badge.run{color:var(--blue);border-color:var(--blue)}
.badge.taint{color:var(--warn);border-color:var(--warn)}
.stage{border:1px solid var(--line);border-radius:8px;margin:12px 0;overflow:hidden}
.stage>.hd{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel)}
.stage>.hd .name{font-weight:600}
.stage>.bd{padding:14px}
.meta{color:var(--dim);font-size:12px}
pre{background:#0b0d10;border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:46vh;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
button{font:inherit;padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--blue)}
button.ok{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:600}
button.no{background:var(--bad);border-color:var(--bad);color:#2a0b0b;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:62px;background:#0b0d10;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;resize:vertical}
.empty{color:var(--dim);padding:40px 0;text-align:center}
.note{color:var(--warn);font-size:12px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 16px;max-width:min(520px,80vw);white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>审批台</h1>
  <span id="count" class="meta"></span>
  <span class="grow"></span>
  <a href="/agent">对话台 →</a>
  <button id="refresh">刷新</button>
</header>
<main>
  <div id="list"><div class="empty">加载中…</div></div>
  <div id="detail"><div class="empty">左边选一条运行</div></div>
</main>
<script>
const $ = s => document.querySelector(s);
let runs = [], cur = null;

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

async function api(path, opts, _retried) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  // 401 = 会话 Cookie 过期（30 天）。不弹门的话，页面就退回启动时那个空白状态——**同一个 bug
  // 换个时间点重演一次**。弹门、重试一次；再 401 才当真错。
  if (r.status === 401 && !_retried) { await showLogin(); return api(path, opts, true); }
  const body = await r.json().catch(() => ({}));
  // 失败要把**服务端给的原因**原样交出来，别换成一句"操作失败"——审批台上最怕的就是
  // 点了没反应又不知道为什么。
  if (!r.ok) throw new Error(body.detail || (r.status + " " + r.statusText));
  return body;
}

const badge = s => s === "awaiting_review" ? '<span class="badge wait">等你批</span>'
  : s === "failed" ? '<span class="badge fail">失败</span>'
  : s === "done" ? '<span class="badge">已完成</span>'
  : '<span class="badge run">' + s + "</span>";

async function loadList() {
  try {
    const d = await api("/api/pipelines");
    runs = d.runs || [];
    $("#count").textContent = d.awaiting ? d.awaiting + " 条等你批" : "没有等你批的";
    $("#list").innerHTML = runs.length ? runs.map(r => `
      <div class="run${cur && cur.run_id === r.run_id ? " sel" : ""}" data-id="${r.run_id}">
        <div class="top"><strong>${r.pipeline}</strong>${badge(r.status)}</div>
        <div class="id">${r.run_id}</div>
        <div class="meta">${r.awaiting ? "等批：" + r.awaiting + " · " : ""}${r.tokens} tok</div>
      </div>`).join("") : '<div class="empty">没有在跑的流水线</div>';
    $("#list").querySelectorAll(".run").forEach(el =>
      el.onclick = () => loadDetail(el.dataset.id));
  } catch (e) { $("#list").innerHTML = '<div class="empty">读不到：' + e.message + "</div>"; }
}

function renderStage(s) {
  const p = s.product;
  const spec = s.spec || {};
  const flags = [spec.review && "要人批", spec.outbound && "对外动作", spec.web && "要出网"]
    .filter(Boolean).map(t => `<span class="badge">${t}</span>`).join("");
  let body = "";
  if (p && p.missing) {
    body = `<div class="note">⚠ 产出物 ${p.id} 读不到——台账可能被改过。下游会按污点处理。</div>`;
  } else if (p) {
    body = `<div class="meta">${p.kind} · ${p.id}${p.tainted ? ' <span class="badge taint">⚠外部来源</span>' : ""}</div>
      <div style="margin:6px 0 10px">${p.summary || ""}</div>
      <pre>${JSON.stringify(p.payload, null, 2).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;")}</pre>`;
    if (p.tainted && p.taint_reason) body += `<div class="note">来源：${p.taint_reason}</div>`;
  } else {
    body = '<div class="meta">还没有产出。</div>';
  }
  if (s.note) body += `<div class="note">${s.note}</div>`;
  return `<div class="stage"><div class="hd"><span class="name">${s.id}</span>${badge(s.status)}${flags}
    <span class="grow" style="flex:1"></span><span class="meta">${s.tokens ? s.tokens + " tok" : ""}${s.attempts > 1 ? " · 第 " + s.attempts + " 次" : ""}</span></div>
    <div class="bd">${body}</div></div>`;
}

async function loadDetail(id) {
  try {
    cur = await api("/api/pipelines/" + encodeURIComponent(id));
  } catch (e) { toast("读不到：" + e.message); return; }
  const waiting = cur.awaiting;
  $("#detail").innerHTML = `
    <div class="meta">${cur.pipeline} · ${cur.run_id} · ${cur.status}</div>
    ${cur.stages.map(renderStage).join("")}
    ${waiting ? `
      <div class="stage"><div class="hd"><span class="name">给「${waiting}」一个回执</span></div>
      <div class="bd">
        <textarea id="cm" placeholder="驳回必须写一句为什么——不说理由，重跑出来还是原样。"></textarea>
        <div class="acts">
          <button class="ok" id="b-ok">批准</button>
          <button class="no" id="b-no">驳回重做</button>
          <button id="b-later">挂起</button>
          <span class="meta">批准后由定时作业或 IM 里的 /go 往下推。</span>
        </div>
      </div></div>` : '<div class="meta">当前没有等你批的工序。</div>'}`;
  if (waiting) {
    $("#b-ok").onclick = () => send("approve");
    $("#b-no").onclick = () => send("reject");
    $("#b-later").onclick = () => send("defer");
  }
  loadList();
}

async function send(verdict) {
  const comment = ($("#cm") || {}).value || "";
  document.querySelectorAll(".acts button").forEach(b => b.disabled = true);
  try {
    const r = await api("/api/pipelines/" + encodeURIComponent(cur.run_id) + "/review",
      { method: "POST", body: JSON.stringify({ verdict, comment }) });
    toast(r.reason || r.status);
    await loadDetail(cur.run_id);
  } catch (e) {
    toast(e.message);            // 服务端说的原因原样显示（例如"驳回要写一句为什么"）
    document.querySelectorAll(".acts button").forEach(b => b.disabled = false);
  }
}

$("#refresh").onclick = () => cur ? loadDetail(cur.run_id) : loadList();

// ── 登录门 ────────────────────────────────────────────────────────────────
// 页面外壳在鉴权豁免清单里（否则没法登录），但它读的 /api/pipelines 不豁免。设了
// VORTOCODE_API_TOKEN 的机器上，直接 loadList() 的下场是整页只剩一行"读不到：
// Unauthorized"——真机 2026-09-11：钉钉通知里的 /review 链接点开就是这个样子，而那条
// 链接是整条运营链唯一的人工入口。
//
// 豁免清单会让人以为"页面能开 = 页面能用"，这两件事之间差的就是这个门。/agent 有，
// 这里当时漏了；凡是进豁免清单的页面都得自带它。
function showLogin() {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:var(--bg);display:flex;"
      + "align-items:center;justify-content:center;z-index:9999";
    ov.innerHTML = '<div style="background:var(--panel);border:1px solid var(--line);'
      + 'border-radius:12px;padding:24px;width:320px;max-width:88vw">'
      + '<div style="font-weight:600;margin-bottom:12px">🔒 需要访问令牌</div>'
      + '<input id="lg-t" type="password" placeholder="API Token" style="width:100%;'
      + 'box-sizing:border-box;padding:9px;background:var(--bg);border:1px solid var(--line);'
      + 'border-radius:8px;color:var(--fg);margin-bottom:10px">'
      + '<div id="lg-e" style="color:var(--bad);font-size:12px;height:16px;margin-bottom:8px"></div>'
      + '<button id="lg-b" style="width:100%;padding:9px;background:var(--blue);color:#fff;'
      + 'border:0;border-radius:8px;cursor:pointer;font-weight:600">登录</button></div>';
    document.body.appendChild(ov);
    const inp = ov.querySelector("#lg-t"), err = ov.querySelector("#lg-e");
    inp.focus();
    async function submit() {
      err.textContent = "";
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: inp.value }) });
        if (r.ok) { ov.remove(); resolve(); } else { err.textContent = "令牌不正确"; inp.select(); }
      } catch { err.textContent = "登录失败，请重试"; }
    }
    ov.querySelector("#lg-b").onclick = submit;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  });
}

async function boot() {
  try {
    const st = await (await fetch("/api/auth/status", { cache: "no-store" })).json();
    if (st.auth_required && !st.authed) await showLogin();
  } catch { /* 状态查不到：按无鉴权处理，照常往下走 */ }
  loadList();
  setInterval(() => { if (!document.hidden && !cur) loadList(); }, 30000);
}
boot();
</script>
</body>
</html>
