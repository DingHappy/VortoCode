<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化研究平台 - VortoCode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
            --text: #e6edf3; --text2: #8b949e; --border: #30363d;
            --accent: #58a6ff; --green: #3fb950; --red: #f85149;
            --yellow: #d29922; --purple: #a371f7;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        h1 .badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--green); color: #000; }
        h1 .badge.off { background: var(--text2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .card h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
        .stat.green { color: var(--green); }
        .stat.yellow { color: var(--yellow); }
        .stat.red { color: var(--red); }
        .stat.blue { color: var(--accent); }
        .detail { font-size: 13px; color: var(--text2); }
        .loop-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .loop-row:last-child { border: none; }
        .loop-name { font-weight: 600; }
        .loop-status { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
        .loop-status.running { background: rgba(63,185,80,0.15); color: var(--green); }
        .loop-status.idle { background: rgba(139,148,158,0.15); color: var(--text2); }
        .loop-status.error { background: rgba(248,81,73,0.15); color: var(--red); }
        .actions { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn { padding: 10px 20px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 14px; transition: all 0.15s; }
        .btn:hover { background: var(--border); }
        .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn.primary:hover { opacity: 0.9; }
        .btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .stage-btns { display: flex; gap: 8px; margin-bottom: 24px; }
        .stage-btns .btn { flex: 1; text-align: center; }
        .log { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; color: var(--text2); }
        .log .time { color: var(--text2); margin-right: 8px; }
        .log .ok { color: var(--green); }
        .log .err { color: var(--red); }
        .health-checks { margin-top: 12px; }
        .health-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .health-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .health-dot.ok { background: var(--green); }
        .health-dot.err { background: var(--red); }
        #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border); display: none; font-size: 14px; z-index: 100; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            量化研究平台
            <span class="badge off" id="statusBadge">未启动</span>
        </h1>

        <div class="grid">
            <div class="card">
                <h3>流水线状态</h3>
                <div class="stat blue" id="statStatus">--</div>
                <div class="detail" id="statDetail">等待连接...</div>
            </div>
            <div class="card">
                <h3>总迭代次数</h3>
                <div class="stat green" id="statIterations">0</div>
                <div class="detail">所有循环累计</div>
            </div>
            <div class="card">
                <h3>活跃循环</h3>
                <div class="stat yellow" id="statLoops">0</div>
                <div class="detail" id="statLoopDetail">--</div>
            </div>
            <div class="card">
                <h3>平台健康</h3>
                <div class="stat" id="statHealth">--</div>
                <div class="health-checks" id="healthChecks"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn primary" id="btnStart" onclick="startPipeline()">启动流水线</button>
            <button class="btn danger" id="btnStop" onclick="stopPipeline()" disabled>停止</button>
            <button class="btn" onclick="refreshStatus()">刷新状态</button>
            <button class="btn" onclick="checkHealth()">健康检查</button>
        </div>

        <div class="stage-btns">
            <button class="btn" onclick="runStage('news')">采集新闻</button>
            <button class="btn" onclick="runStage('sentiment')">情绪分析</button>
            <button class="btn" onclick="runStage('factor')">因子研究</button>
            <button class="btn" onclick="runStage('review')">每日复盘</button>
        </div>

        <div class="card" style="margin-bottom:16px">
            <h3>各循环状态</h3>
            <div id="loopsList"><div class="detail">加载中...</div></div>
        </div>

        <div class="card">
            <h3>日志</h3>
            <div class="log" id="logArea"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const API = window.location.origin;
        let ws = null;

        function log(msg, type = '') {
            const el = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : '';
            el.innerHTML += `<div><span class="time">${time}</span><span class="${cls}">${msg}</span></div>`;
            el.scrollTop = el.scrollHeight;
        }

        function toast(msg, duration = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', duration);
        }

        async function apiCall(method, path, body = null) {
            try {
                const opts = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) opts.body = JSON.stringify(body);
                const resp = await fetch(API + path, opts);
                return await resp.json();
            } catch (e) {
                log(`API 错误: ${e.message}`, 'err');
                return null;
            }
        }

        async function refreshStatus() {
            const data = await apiCall('GET', '/api/quant/status');
            if (!data) return;
            updateUI(data);
        }

        async function checkHealth() {
            const data = await apiCall('GET', '/api/quant/health');
            if (!data) return;
            const el = document.getElementById('statHealth');
            el.textContent = data.healthy ? '正常' : '异常';
            el.className = 'stat ' + (data.healthy ? 'green' : 'red');
            const checks = document.getElementById('healthChecks');
            checks.innerHTML = '';
            for (const [name, info] of Object.entries(data.checks || {})) {
                const ok = info.status === 'ok' || info.status === 'running' || info.status === 'idle' || info.status === 'not_initialized';
                checks.innerHTML += `<div class="health-row"><span><span class="health-dot ${ok ? 'ok' : 'err'}"></span>${name}</span><span>${info.status}</span></div>`;
            }
            log(`健康检查: ${data.healthy ? '正常' : '异常'}`, data.healthy ? 'ok' : 'err');
        }

        function updateUI(data) {
            const badge = document.getElementById('statusBadge');
            const running = data.running;
            badge.textContent = running ? '运行中' : '未启动';
            badge.className = 'badge' + (running ? '' : ' off');

            document.getElementById('statStatus').textContent = running ? '运行中' : (data.initialized ? '已停止' : '未初始化');
            document.getElementById('statStatus').className = 'stat ' + (running ? 'green' : 'blue');
            document.getElementById('btnStart').disabled = running;
            document.getElementById('btnStop').disabled = !running;

            const loops = data.loops || {};
            let totalIter = 0;
            let activeCount = 0;
            const list = document.getElementById('loopsList');
            list.innerHTML = '';

            for (const [name, info] of Object.entries(loops)) {
                totalIter += info.iterations || 0;
                if (info.status === 'running') activeCount++;

                const statusClass = info.status === 'running' ? 'running' : info.status === 'error' ? 'error' : 'idle';
                const displayName = name.replace('quant_', '');
                const lastCheck = info.last_check ? new Date(info.last_check).toLocaleString() : '--';
                list.innerHTML += `
                    <div class="loop-row">
                        <div>
                            <span class="loop-name">${displayName}</span>
                            <div class="detail">迭代 ${info.iterations || 0} | 上次: ${lastCheck} | 间隔 ${info.interval || '--'}s</div>
                        </div>
                        <span class="loop-status ${statusClass}">${info.status}</span>
                    </div>`;
            }

            document.getElementById('statIterations').textContent = totalIter;
            document.getElementById('statLoops').textContent = activeCount;
            document.getElementById('statLoopDetail').textContent = `共 ${Object.keys(loops).length} 个循环`;
        }

        async function startPipeline() {
            log('正在启动流水线...');
            const data = await apiCall('POST', '/api/quant/start');
            if (data && data.success) {
                log('流水线已启动', 'ok');
                toast('流水线已启动');
                connectWS();
                refreshStatus();
            } else {
                log(`启动失败: ${data?.detail || '未知错误'}`, 'err');
            }
        }

        async function stopPipeline() {
            log('正在停止流水线...');
            const data = await apiCall('POST', '/api/quant/stop');
            if (data && data.success) {
                log('流水线已停止', 'ok');
                toast('流水线已停止');
                refreshStatus();
            } else {
                log(`停止失败: ${data?.detail || '未知错误'}`, 'err');
            }
        }

        async function runStage(stage) {
            log(`执行阶段: ${stage}...`);
            const data = await apiCall('POST', `/api/quant/run/${stage}`);
            if (data) {
                const status = data.success ? '成功' : '失败';
                log(`阶段 ${stage}: ${status} (${(data.duration || 0).toFixed(1)}s)`, data.success ? 'ok' : 'err');
                toast(`${stage}: ${status}`);
                refreshStatus();
            }
        }

        function connectWS() {
            if (ws) ws.close();
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/quant`);
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'quant_status') {
                        updateUI({ initialized: true, running: true, loops: msg.data });
                    }
                } catch {}
            };
            ws.onopen = () => log('WebSocket 已连接', 'ok');
            ws.onclose = () => log('WebSocket 已断开');
            ws.onerror = () => log('WebSocket 错误', 'err');
        }

        // 初始化
        refreshStatus();
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
